<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Amor para Alina ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030108;
      font-family: 'Poppins', sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <canvas id="galaxyCanvas"></canvas>

  <script>
    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerX = width / 2;
      centerY = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Nombre principal
    const targetName = "Alina ✨";

    // Frases dedicadas para Alina
    const phrases = [
      "Alina, mi reina 👑", "Mi vida Alina ❤️", "Mi mundo eres tú ✨", "Sin ti no soy nada 💖",
      "Eres mi todo 🌸", "Solo tú, Alina 💎", "Gracias por existir 💕", "Eres mi luz 💖",
      "Mi cielo 🌌", "Mi corazón 💓", "Siempre tú, Alina 💞", "Eres especial 🌹",
      "Contigo es todo 🌷", "Eres mi paz 🕊️", "Mi sueño hecho realidad 💫", "Te amo Alina ❤️",
      "Por siempre juntos ♾️", "Eres perfecta 💖", "Alina, mi razón 💗", "Completamente enamorado 🌹",
      "Mi ángel 🪽", "Mi hogar 🏠", "Mi felicidad 🌸", "Cada día te amo más 💞",
      "El sol de mis días ☀️", "Mi universo entero 🪐", "Eternamente tuya/o 💌"
    ];

    // Configuración de estrellas y nebulosas
    const numParticles = 2000;
    const particles = [];
    const textItems = [];
    const interactiveParticles = [];

    // Crear partículas para la galaxia espiral
    for (let i = 0; i < numParticles; i++) {
      const radius = Math.pow(Math.random(), 2) * (Math.min(width, height) * 0.48) + 25;
      const angle = Math.random() * Math.PI * 2 + (radius * 0.012);
      const speed = (0.0015 + (1 / radius) * 0.12);
      const size = Math.random() * 2.2 + 0.2;
      const opacity = Math.random() * 0.85 + 0.15;
      // Colores variados entre blanco, magenta, azul cosmos y dorado
      const colors = ['#fff', '#ffb3d9', '#ff66b2', '#cce6ff', '#ffd700'];
      const color = colors[Math.floor(Math.random() * colors.length)];

      particles.push({ radius, angle, speed, size, opacity, color });
    }

    // Distribución de frases flotantes
    phrases.forEach((phrase, idx) => {
      const radius = 70 + (idx / phrases.length) * (Math.min(width, height) * 0.43);
      const angle = (idx * (Math.PI * 2 / 7)) + (radius * 0.007);
      const speed = 0.0012 + (1 / radius) * 0.08;
      const fontSize = Math.max(12, Math.min(19, 10 + (radius * 0.014)));

      textItems.push({
        text: phrase,
        radius: radius,
        angle: angle,
        speed: speed,
        fontSize: fontSize
      });
    });

    // Interacción con ratón / táctil
    function addInteractiveParticle(x, y) {
      for (let i = 0; i < 3; i++) {
        interactiveParticles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y + (Math.random() - 0.5) * 20,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2 - 1,
          size: Math.random() * 14 + 10,
          alpha: 1,
          isHeart: Math.random() > 0.4
        });
      }
    }

    window.addEventListener('mousemove', (e) => addInteractiveParticle(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        addInteractiveParticle(e.touches[0].clientX, e.touches[0].clientY);
      }
    });

    let pulseTimer = 0;

    // Bucle de animación
    function animate() {
      pulseTimer += 0.03;
      const pulseScale = 1 + Math.sin(pulseTimer) * 0.08;

      // Fondo oscuro con rastro estelar
      ctx.fillStyle = 'rgba(3, 1, 8, 0.18)';
      ctx.fillRect(0, 0, width, height);

      const maxRadius = Math.min(width, height) * 0.48;

      // 1. Resplandor de Nebulosa en el fondo
      const bgGlow = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, maxRadius);
      bgGlow.addColorStop(0, 'rgba(255, 50, 150, 0.35)');
      bgGlow.addColorStop(0.4, 'rgba(140, 20, 120, 0.15)');
      bgGlow.addColorStop(0.8, 'rgba(30, 10, 50, 0.08)');
      bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = bgGlow;
      ctx.beginPath();
      ctx.arc(centerX, centerY, maxRadius, 0, Math.PI * 2);
      ctx.fill();

      // 2. Dibujar Estrellas de la Galaxia
      particles.forEach(p => {
        p.angle += p.speed;

        const x = centerX + Math.cos(p.angle) * p.radius;
        const y = centerY + Math.sin(p.angle) * (p.radius * 0.62);

        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.opacity;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;

      // 3. Anillo de Luz Central Palpitante
      const holeRadius = 42 * pulseScale;
      const ringGlow = ctx.createRadialGradient(centerX, centerY, holeRadius * 0.4, centerX, centerY, holeRadius + 30);
      ringGlow.addColorStop(0, 'rgba(255, 255, 255, 1)');
      ringGlow.addColorStop(0.3, 'rgba(255, 105, 180, 0.9)');
      ringGlow.addColorStop(0.7, 'rgba(180, 0, 100, 0.4)');
      ringGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = ringGlow;
      ctx.beginPath();
      ctx.arc(centerX, centerY, holeRadius + 30, 0, Math.PI * 2);
      ctx.fill();

      // Núcleo del Sol/Estrella Central
      ctx.fillStyle = '#0a0008';
      ctx.beginPath();
      ctx.arc(centerX, centerY, holeRadius, 0, Math.PI * 2);
      ctx.fill();

      // 4. Nombre "ALINA" en el centro de la Galaxia
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.font = `700 ${Math.max(22, holeRadius * 0.75)}px 'Great Vibes', cursive, 'Poppins'`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Sombra Neón Dorada / Rosada para Alina
      ctx.shadowColor = '#ff66cc';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#ffe6f2';
      ctx.fillText(targetName, 0, 2);
      ctx.restore();

      // 5. Dibujar Frases y Emojis Flotantes
      textItems.forEach(t => {
        t.angle += t.speed;

        const x = centerX + Math.cos(t.angle) * t.radius;
        const y = centerY + Math.sin(t.angle) * (t.radius * 0.62);

        ctx.save();
        ctx.translate(x, y);

        ctx.font = `600 ${t.fontSize}px 'Poppins', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.shadowColor = 'rgba(255, 105, 180, 0.95)';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#ffcce6';

        ctx.fillText(t.text, 0, 0);
        ctx.restore();
      });

      // 6. Partículas interactivas del cursor (Corazones y destellos)
      for (let i = interactiveParticles.length - 1; i >= 0; i--) {
        const p = interactiveParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;

        if (p.alpha <= 0) {
          interactiveParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        if (p.isHeart) {
          ctx.font = `${p.size}px sans-serif`;
          ctx.fillText("💖", p.x, p.y);
        } else {
          ctx.fillStyle = '#ffe680';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size / 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
