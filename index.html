<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corazón 3D Rojo - Bayron & Alina</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050003;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
    }

    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Overlay para nombres y frase */
    .names-overlay {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      text-align: center;
      color: #ffffff;
      z-index: 10;
      width: 90%;
      max-width: 800px;
    }

    .main-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 
        0 0 10px #ff0055,
        0 0 20px #ff0055,
        0 0 40px #ff0000,
        0 0 80px #b30000;
      animation: pulseText 2s ease-in-out infinite alternate;
    }

    .sub-phrase {
      font-size: 1.15rem;
      font-weight: 400;
      font-style: italic;
      margin-top: 8px;
      color: #ffb3c1;
      text-shadow: 0 0 8px rgba(255, 0, 85, 0.7);
      letter-spacing: 1px;
    }

    @keyframes pulseText {
      0% {
        transform: scale(0.96);
        opacity: 0.88;
      }
      100% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      .main-title { font-size: 1.8rem; }
      .sub-phrase { font-size: 0.95rem; }
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="names-overlay">
    <div class="main-title">Bayron & Alina</div>
    <div class="sub-phrase">"Escribiendo nuestro amor infinito a pasitos de tortuga 🐢❤️🐬"</div>
  </div>

  <div id="webgl-container"></div>

  <script>
    // 1. Escena, Cámara y Renderizador
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050003, 0.012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 34);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Grupo principal para el corazón y el número 10
    const heartGroup = new THREE.Group();
    scene.add(heartGroup);

    // Textura de brillo para las partículas
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.3, 'rgba(255,100,150,0.8)');
    grad.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(16, 16, 16, 0, Math.PI * 2);
    ctx.fill();
    const texture = new THREE.CanvasTexture(canvas);

    // 2. Corazón 3D Rojo Neón
    const particleCount = 8000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const colorRed = new THREE.Color(0xff0033);  // Rojo brillante
    const colorGold = new THREE.Color(0xff4d6d); // Carmesí rosado
    const colorDeep = new THREE.Color(0x990000); // Rojo oscuro fondo

    for (let i = 0; i < particleCount; i++) {
      const t = Math.random() * Math.PI * 2;
      const u = (Math.random() - 0.5) * Math.PI;

      const r = Math.pow(Math.random(), 0.35); // Densidad
      const x = 16 * Math.pow(Math.sin(t), 3) * Math.cos(u) * r * 0.55;
      const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * Math.cos(u) * r * 0.55;
      const z = Math.sin(u) * 4.5 * r;

      positions[i * 3] = x;
      positions[i * 3 + 1] = y + 2.5;
      positions[i * 3 + 2] = z;

      // Gradiente de tonos rojos
      const mixedColor = colorRed.clone().lerp(Math.random() > 0.5 ? colorGold : colorDeep, Math.random());
      colors[i * 3] = mixedColor.r;
      colors[i * 3 + 1] = mixedColor.g;
      colors[i * 3 + 2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.38,
      vertexColors: true,
      map: texture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const heartParticles = new THREE.Points(geometry, material);
    heartGroup.add(heartParticles);

    // 3. Crear el número "10" 3D brillante en el centro del corazón
    function createNumber10Particles() {
      const numPoints = 1200;
      const numPositions = [];
      const numColors = [];
      const goldColor = new THREE.Color(0xffd700);
      const brightWhite = new THREE.Color(0xffffff);

      // Trazo manual para el "1" y el "0"
      for (let i = 0; i < numPoints; i++) {
        let px = 0, py = 0, pz = (Math.random() - 0.5) * 1.5;
        const choice = Math.random();

        if (choice < 0.3) {
          // El número '1'
          px = -3.2 + (Math.random() - 0.5) * 0.4;
          py = (Math.random() - 0.5) * 4.5;
        } else {
          // El número '0'
          const angle = Math.random() * Math.PI * 2;
          px = 2.2 + Math.cos(angle) * 1.6;
          py = Math.sin(angle) * 2.3;
        }

        numPositions.push(px, py + 1.2, pz);

        const col = goldColor.clone().lerp(brightWhite, Math.random() * 0.6);
        numColors.push(col.r, col.g, col.b);
      }

      const numGeo = new THREE.BufferGeometry();
      numGeo.setAttribute('position', new THREE.Float32BufferAttribute(numPositions, 3));
      numGeo.setAttribute('color', new THREE.Float32BufferAttribute(numColors, 3));

      const numMat = new THREE.PointsMaterial({
        size: 0.32,
        vertexColors: true,
        map: texture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      return new THREE.Points(numGeo, numMat);
    }

    const number10 = createNumber10Particles();
    heartGroup.add(number10);

    // 4. Anillo de energía / Pedestal en la base
    const ringCount = 2000;
    const ringGeometry = new THREE.BufferGeometry();
    const ringPositions = new Float32Array(ringCount * 3);
    const ringColors = new Float32Array(ringCount * 3);

    for (let i = 0; i < ringCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 6.5 + Math.random() * 3.0;

      ringPositions[i * 3] = Math.cos(angle) * radius;
      ringPositions[i * 3 + 1] = -7.5 + (Math.random() - 0.5) * 0.5;
      ringPositions[i * 3 + 2] = Math.sin(angle) * radius;

      ringColors[i * 3] = 1.0; 
      ringColors[i * 3 + 1] = 0.1 + Math.random() * 0.3; 
      ringColors[i * 3 + 2] = 0.3;
    }

    ringGeometry.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
    ringGeometry.setAttribute('color', new THREE.BufferAttribute(ringColors, 3));

    const ringMaterial = new THREE.PointsMaterial({
      size: 0.3,
      vertexColors: true,
      map: texture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const energyRing = new THREE.Points(ringGeometry, ringMaterial);
    scene.add(energyRing);

    // 5. Partículas ascendentes (chispas flotantes)
    const sparksCount = 400;
    const sparksGeo = new THREE.BufferGeometry();
    const sparksPos = new Float32Array(sparksCount * 3);

    for (let i = 0; i < sparksCount; i++) {
      sparksPos[i * 3] = (Math.random() - 0.5) * 25;
      sparksPos[i * 3 + 1] = (Math.random() - 0.5) * 25;
      sparksPos[i * 3 + 2] = (Math.random() - 0.5) * 25;
    }

    sparksGeo.setAttribute('position', new THREE.BufferAttribute(sparksPos, 3));
    const sparksMat = new THREE.PointsMaterial({
      size: 0.22,
      color: 0xff7799,
      map: texture,
      transparent: true,
      blending: THREE.AdditiveBlending
    });

    const sparks = new THREE.Points(sparksGeo, sparksMat);
    scene.add(sparks);

    // Interacción con cursor / touch
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 0.5;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 0.5;
    });

    // 6. Bucle de Animación
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Rotación 3D del corazón
      heartGroup.rotation.y = elapsedTime * 0.6;
      
      // Rotación e inclinación suave con el mouse
      heartGroup.rotation.x = mouseY * 0.5;
      heartGroup.rotation.z = mouseX * 0.3;

      // Latido constante del corazón
      const pulse = 1 + Math.sin(elapsedTime * 3.5) * 0.04;
      heartGroup.scale.set(pulse, pulse, pulse);
      heartGroup.position.y = Math.sin(elapsedTime * 2) * 0.5;

      // Animación de la base de energía
      energyRing.rotation.y = -elapsedTime * 0.7;

      // Animación de las chispas ascendentes
      const positions = sparksGeo.attributes.position.array;
      for (let i = 0; i < sparksCount; i++) {
        positions[i * 3 + 1] += 0.04;
        if (positions[i * 3 + 1] > 15) {
          positions[i * 3 + 1] = -12;
        }
      }
      sparksGeo.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }

    animate();

    // Responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
